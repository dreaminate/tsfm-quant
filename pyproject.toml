[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tsfm-quant"
version = "0.1.0"
description = "Fine-tuned time-series foundation models in a 9+1 expert architecture for crypto & financial forecasting. Open weights, honest backtests."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "dreaminate" }]
keywords = [
    "time-series",
    "forecasting",
    "foundation-models",
    "chronos",
    "quant",
    "crypto",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/dreaminate/tsfm-quant"
Issues = "https://github.com/dreaminate/tsfm-quant/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tsfm_quant"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
